services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "8081:3000"

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "8080:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: npm run dev
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    command: npm run dev    

volumes:
  backend_node_modules:
  frontend_node_modules:

